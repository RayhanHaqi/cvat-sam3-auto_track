metadata:
  name: meta-sam3-tracker-v4
  namespace: nuclio
  annotations:
    name: SAM 3 Video Tracker v4
    type: tracker
    framework: pytorch
    spec: |
      [
        { "id": 0, "name": "ping_pong_ball" }
      ]

spec:
  description: SAM 3 single-object video tracker (C, mid-exposure mask geometry)
  runtime: 'python:3.10'
  handler: main:handler
  eventTimeout: 120s

  env:
    - name: PYTHONPATH
      value: /opt/nuclio/sam3
    - name: PYTORCH_CUDA_ALLOC_CONF
      value: expandable_segments:True
    - name: TRITON_INTERPRET
      value: "1"
    - name: SAM3_PROMPT_MODE
      value: box
    - name: SAM3_TEXT_PROMPT
      value: ping pong ball
    - name: SAM3_OUTPUT_POLICY
      value: motion_blur_center_box
    - name: SAM3_MOTION_BLUR_TARGET_FRACTION
      value: "0.5"
    - name: SAM3_MOTION_BLUR_MIN_EIGEN_RATIO
      value: "1.44"
    - name: SAM3_MOTION_BLUR_MIN_MASK_PIXELS
      value: "6"
    - name: SAM3_MOTION_BLUR_INTENSITY_CENTER
      value: "0"
    - name: SAM3_MOTION_BLUR_STABILIZED_DIAMETER
      value: "0"
    - name: SAM3_MOTION_BLUR_DIAMETER_WINDOW
      value: "2"
    - name: SAM3_OUTPUT_PROB_THRESH
      value: "0.0"
    - name: SAM3_DETECTION_SCORE_THRESHOLD
      value: "0.5"
    - name: SAM3_DETECTION_MAX_PROMPT_DISTANCE_PX
      value: "0"
    - name: SAM3_RECOVER_AFTER_MISS
      value: "0"
    - name: SAM3_EDGE_HOLD
      value: "0"
    - name: SAM3_UI_GATE_CLAMP
      value: "0"
    - name: SAM3_TRAILING_HOLD_FRAMES
      value: "0"
    - name: SAM3_RECOVER_MAX_GAP
      value: "2"
    - name: SAM3_RESEED_AFTER_MISS
      value: "0"
    - name: SAM3_RESEED_MAX_ATTEMPTS
      value: "2"
    - name: SAM3_PROMPT_BOX_SCALE
      value: "1.0"
    - name: SAM3_ROD_MASK_ANCHOR
      value: "0"
    - name: SAM3_ROD_MASK_MAX_WIDTH
      value: "3"
    - name: SAM3_ROD_MASK_MIN_ASPECT
      value: "2.0"
    - name: SAM3_ROD_BLOB_REANCHOR
      value: "0"
    - name: SAM3_ROD_BLOB_SEARCH_PX
      value: "24"
    - name: SAM3_ROD_BLOB_MARGIN
      value: "15.0"
    - name: SAM3_ROD_MASK_LOLLIPOP_RATIO
      value: "2.0"
    - name: SAM3_IR_REFINE
      value: "1"
    - name: SAM3_IR_STOP_ON_MISSING
      value: "0"
    - name: SAM3_RETURN_G0_TIMELINE
      value: "1"
    - name: AUTO_TRACK_DIAGNOSTICS
      value: "1"

  build:
    image: cvat.meta.sam3.tracker:v4-darkball-20261019
    baseImage: nvidia/cuda:12.8.1-cudnn-runtime-ubuntu22.04
    directives:
      preCopy:
        - kind: ENV
          value: NVIDIA_VISIBLE_DEVICES=all NVIDIA_DRIVER_CAPABILITIES=compute,utility DEBIAN_FRONTEND=noninteractive
        - kind: RUN
          value: |-
            apt-get update && apt-get install -y --no-install-recommends \
              git wget ca-certificates \
              python3 python3-dev python3-pip \
              libgl1-mesa-glx libglib2.0-0 ffmpeg build-essential \
            && ln -sf /usr/bin/python3 /usr/bin/python \
            && rm -rf /var/lib/apt/lists/*
        - kind: RUN
          value: |-
            python3 -m pip install --upgrade pip setuptools wheel --no-cache-dir && \
            python3 -m pip install torch torchvision \
              --extra-index-url https://download.pytorch.org/whl/cu128 \
              --no-cache-dir
        - kind: RUN
          value: |-
            python3 -m pip install "numpy>=1.26,<2" opencv-python-headless pillow \
              matplotlib pycocotools psutil setuptools scikit-image --no-cache-dir
        - kind: RUN
          value: |-
            git clone https://github.com/facebookresearch/sam3.git /opt/nuclio/sam3 && \
            cd /opt/nuclio/sam3 && python3 -m pip install -e . --no-cache-dir
        - kind: ENV
          value: HF_HOME=/opt/nuclio/sam3/cache
        - kind: RUN
          value: |-
            python3 -m pip install einops ninja setproctitle --no-cache-dir && \
            (python3 -m pip install flash-attn --no-build-isolation --no-cache-dir \
              --index-url https://download.pytorch.org/whl/cu128 \
              || echo "WARNING: flash-attn install failed; using PyTorch fallback attention")

  triggers:
    myHttpTrigger:
      numWorkers: 1
      kind: 'http'
      workerAvailabilityTimeoutMilliseconds: 120000
      attributes:
        maxRequestBodySize: 268435456

  resources:
    limits:
      nvidia.com/gpu: 1

  platform:
    attributes:
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: volume
